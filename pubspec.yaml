name: profile_finder
description: "Roof Profile Finder App"

publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/steel_profiles.json
    - assets/data/cement_profiles.json
    - assets/data/tile_profiles_uk_phase2.json
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  image_path_android: "assets/images/icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/icon.png"