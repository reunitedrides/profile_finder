name: profile_finder
description: "Roof Profile Finder App"
publish_to: 'none'
version: 1.0.0+33

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  sensors_plus: ^6.0.0
  geolocator: ^13.0.0
  share_plus: ^10.0.0
  google_maps_flutter: ^2.9.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.0
  pdf: ^3.10.8
  printing: ^5.12.0
  firebase_messaging: ^15.0.0
  audioplayers: ^6.6.0
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/steel_profiles.json
    - assets/data/cement_profiles.json
    - assets/data/tile_profiles_uk_phase2.json
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
